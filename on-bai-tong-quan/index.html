    <style>

       dùng left:15px canh mép trái :text aligin : ép chữ trong body
       vào bên trái .z-index 100 đảm bảo chữ luôn nổi. */
     
      .danh-sach a:visited{

      }

            font-size:13px;
            line-height: 1.4;
        } }

      
      .danh-sach a:active {
